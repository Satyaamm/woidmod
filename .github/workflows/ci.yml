name: CI

# Runs on every PR. Branch protection requires this to pass before merge, so a
# red build blocks the merge button rather than being advisory.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A leaked key in a PUBLIC repo is compromised the instant it is pushed.
      # This gate is cheap; the alternative is a rotation incident.
      - name: Block committed secrets
        run: |
          set -e
          # `.env.example` is a TEMPLATE and is meant to be committed — the setup
          # flow is "copy .env.example to .env". The previous pattern matched it
          # (`\.env($|\.)` accepts `.env` followed by a dot), so any PR that touched
          # the template failed a check named "secret detected" with no secret in it.
          # A gate that cries wolf on the one file everyone edits gets ignored, which
          # costs more than the check earns.
          if git diff --name-only origin/main...HEAD 2>/dev/null \
            | grep -Ei '(^|/)\.env($|\.)|\.(pem|key|p12|pfx)$' \
            | grep -vEi '\.env\.(example|sample|template)$'; then
            echo "::error::Secret-bearing file detected in this PR."
            exit 1
          fi
          # The token formats worth catching, not just the three that existed:
          # GitHub's fine-grained PATs (`github_pat_`) and app tokens are the ones
          # actually issued today, and a pasted private key or Slack token is the
          # same incident as a pasted API key.
          if git grep -nEI '(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
            -- . ':!*.gitignore' ':!.github/workflows/ci.yml'; then
            echo "::error::Hardcoded credential pattern found."
            exit 1
          fi
          echo "No secrets detected."
